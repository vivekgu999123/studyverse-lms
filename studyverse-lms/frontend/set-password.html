<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyVerse — Set Your Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"DM Sans",sans-serif;font-size:15px}
button{cursor:pointer;border:none;background:none;font-family:"DM Sans",sans-serif}
input{font-family:"DM Sans",sans-serif;outline:none;border:none}
:root{
  --bg:#f7f6f3;--bg2:#fff;--bg3:#eeece8;--card:#fff;--border:#e2ddd7;
  --text:#1c1a17;--text2:#5a5450;--muted:#9c9288;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --success:#16a34a;--success-bg:#f0fdf4;
  --warning:#d97706;--warning-bg:#fffbeb;
  --danger:#dc2626;--danger-bg:#fef2f2;
  --shadow2:0 4px 16px rgba(0,0,0,.1);
}
[data-theme="dark"]{
  --bg:#0f0e0c;--bg2:#1a1916;--bg3:#242220;--card:#1a1916;--border:#2e2b28;
  --text:#f0ede8;--text2:#a09890;--muted:#6b6560;
  --accent:#3b82f6;--accent-bg:#172554;
}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;top:-150px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,var(--accent-bg) 0%,transparent 70%);pointer-events:none}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:var(--shadow2);position:relative;z-index:1;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:28px}
.logo-icon{width:38px;height:38px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-family:"Syne",sans-serif;font-size:1.1rem;font-weight:800}
h1{font-family:"Syne",sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:4px}
.sub{color:var(--text2);font-size:.86rem;margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.71rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.input-wrap{position:relative}
.form-input{width:100%;padding:9px 40px 9px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.855rem;transition:border-color .15s}
.form-input:focus{border-color:var(--text);background:var(--bg2)}
.form-input::placeholder{color:var(--muted)}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem}
.strength-bar{height:4px;border-radius:99px;background:var(--bg3);margin-top:6px;overflow:hidden}
.strength-fill{height:100%;border-radius:99px;transition:width .3s,background .3s}
.strength-label{font-size:.72rem;margin-top:3px;color:var(--muted)}
.form-error{color:var(--danger);font-size:.76rem;margin-top:6px;display:none}
.form-error.show{display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;width:100%;margin-top:14px;font-family:"DM Sans",sans-serif}
.btn-primary{background:var(--text);color:var(--bg2)}.btn-primary:hover{opacity:.85}
.rules{background:var(--bg3);border-radius:8px;padding:12px;font-size:.8rem;color:var(--text2);margin-bottom:14px;line-height:1.8}
.rule{display:flex;align-items:center;gap:6px}
.rule.ok{color:var(--success)}.rule.fail{color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">📚</div>
    <span class="logo-text">StudyVerse</span>
  </div>
  <h1>Set Your Password</h1>
  <p class="sub">Welcome! Create a secure password to access your account.</p>

  <div class="rules">
    <div class="rule fail" id="rule-len">✗ Minimum 8 characters</div>
    <div class="rule fail" id="rule-letter">✗ Contains letters</div>
    <div class="rule fail" id="rule-num">✗ Contains numbers</div>
    <div class="rule fail" id="rule-match">✗ Passwords match</div>
  </div>

  <div class="form-group">
    <label class="form-label">Username</label>
    <div class="input-wrap">
      <input type="text" class="form-input" id="username" placeholder="Enter username (display name)" required/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <div class="input-wrap">
      <input type="password" class="form-input" id="new-pass" placeholder="Min. 8 characters" oninput="checkStrength()"/>
      <button class="eye-btn" onclick="toggleEye('new-pass',this)" type="button">👁</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
    <div class="strength-label" id="strength-label">Enter a password</div>
  </div>
  <div class="form-group">
    <label class="form-label">Confirm Password</label>
    <div class="input-wrap">
      <input type="password" class="form-input" id="confirm-pass" placeholder="Repeat password" oninput="checkStrength()"/>
      <button class="eye-btn" onclick="toggleEye('confirm-pass',this)" type="button">👁</button>
    </div>
  </div>
  <div class="form-error" id="form-err"></div>
  <button class="btn btn-primary" id="submit-btn" onclick="doSetPassword()">Set Password & Username</button>
</div>

<script>
function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function rule(id, ok) {
  const el = document.getElementById(id);
  el.className = 'rule ' + (ok ? 'ok' : 'fail');
  el.firstChild.textContent = ok ? '✓' : '✗';
}

function checkStrength() {
  const p  = document.getElementById('new-pass').value;
  const p2 = document.getElementById('confirm-pass').value;
  const len    = p.length >= 8;
  const letter = /[a-zA-Z]/.test(p);
  const num    = /[0-9]/.test(p);
  const match  = p === p2 && p.length > 0;
  rule('rule-len', len); rule('rule-letter', letter); rule('rule-num', num); rule('rule-match', match);
  const score = [len, letter, num, p.length >= 12, /[^a-zA-Z0-9]/.test(p)].filter(Boolean).length;
  const colors = ['','#ef4444','#f97316','#f59e0b','#22c55e','#16a34a'];
  const labels = ['','Very Weak','Weak','Fair','Strong','Very Strong'];
  const fill = document.getElementById('strength-fill');
  fill.style.width = (score * 20) + '%';
  fill.style.background = colors[score] || 'var(--bg3)';
  document.getElementById('strength-label').textContent = p.length ? labels[score] || '' : 'Enter a password';
}

async function doSetPassword() {
  const username = document.getElementById('username').value.trim();
  const newPass = document.getElementById('new-pass').value;
  const confirm = document.getElementById('confirm-pass').value;
  const errEl   = document.getElementById('form-err');
  errEl.className = 'form-error';
  if (!username)                                   return showErr('Username is required.');
  if (newPass.length < 8)                          return showErr('Minimum 8 characters.');
  if (!/[a-zA-Z]/.test(newPass))                  return showErr('Must contain letters.');
  if (!/[0-9]/.test(newPass))                     return showErr('Must contain numbers.');
  if (newPass !== confirm)                          return showErr('Passwords do not match.');
  const token = localStorage.getItem('sv_token') || localStorage.getItem('st_token');
  if (!token) return showErr('Session expired. Please login again.');
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    const res  = await fetch('/api/auth/set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ newPassword: newPass, confirmPassword: confirm, username })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    const user = JSON.parse(localStorage.getItem('sv_user') || localStorage.getItem('st_user') || '{}');
    user.firstLogin = false;
    user.username = username;
    user.name = username;
    localStorage.setItem('sv_user', JSON.stringify(user));
    localStorage.setItem('st_user', JSON.stringify(user));
    window.location.href = '/';
  } catch(err) { showErr(err.message); btn.textContent = 'Set Password & Username'; btn.disabled = false; }
}

function showErr(msg) {
  const el = document.getElementById('form-err');
  el.textContent = msg; el.className = 'form-error show';
}
</script>
</body>
</html>
